<svg xmlns="http://www.w3.org/2000/svg" width="200" height="46" viewBox="0 0 200 46" role="img" aria-label="roaikim logo">
  <defs>
    <style>
      .logo-text {
        font-family: "ZCOOL KuaiLe", "Alibaba PuHuiTi", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 4px;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="200" height="46" fill="#ffffff"/>

  <!-- Stroke writing animation -->
  <linearGradient id="soft-black" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1f2433"/>
    <stop offset="50%" stop-color="#2a3144"/>
    <stop offset="100%" stop-color="#1f2433"/>
  </linearGradient>

  <text x="100" y="32" text-anchor="middle" class="logo-text"
        fill="none" stroke="url(#soft-black)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="320" stroke-dashoffset="320">roaikim
    <animate attributeName="stroke-dashoffset" from="320" to="0" dur="5.2s" repeatCount="indefinite"/>
  </text>

  <!-- Solid fill appears after stroke -->
  <text x="100" y="32" text-anchor="middle" class="logo-text" fill="url(#soft-black)" fill-opacity="0">roaikim
    <animate attributeName="fill-opacity" values="0;0;1" keyTimes="0;0.7;1" dur="5.2s" repeatCount="indefinite"/>
  </text>
</svg>
