<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>横向滚动 绝对可用</title>
  <style>
    .parent {
      display: flex;
      height: 400px;
    }

    /* 左侧核心 */
    .left {
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      gap: 10px;
      align-items: center;
      background: #fff;
    }

    .left-item {
      flex-shrink: 0;
      width: 200px;
      height: 100px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 右侧固定 */
    .right {
      width: 220px;
      flex-shrink: 0;
      background: #f8f9fa;
    }
  </style>
</head>

<body>
  <div class="parent">
    <div class="left" id="box">
      <div class="left-item">1</div>
      <div class="left-item">2</div>
      <div class="left-item">3</div>
      <div class="left-item">4</div>
      <div class="left-item">5</div>
      <div class="left-item">6</div>
      <div class="left-item">7</div>
      <div class="left-item">8</div>
    </div>
    <div class="right">右侧固定</div>
  </div>

  <script>
    // 最简单、最稳定、不会失效的滚轮横向滚动
    document.getElementById('box').addEventListener('wheel', function (e) {
      e.preventDefault();
      this.scrollBy(e.deltaY, 0);
    });
  </script>
</body>
</html>
